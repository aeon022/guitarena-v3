<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitarena - Typographic</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-orten-bg: #1a1715;
      --color-orten-card: #24201e;
      --color-orten-amber: #d9772b;
      --color-orten-text: #e6e0d8;
    }
    body {
      background-color: var(--color-orten-bg);
      color: var(--color-orten-text);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="p-8 md:p-12 border-b border-white/5 flex justify-between items-baseline">
    <h1 class="text-2xl tracking-widest uppercase font-bold text-white">Guitarena</h1>
    <nav class="font-mono text-xs text-white/40 flex gap-6">
      <a href="#" class="hover:text-orten-amber">PROGRAMM</a>
      <a href="#" class="hover:text-orten-amber">ARCHIV</a>
    </nav>
  </header>

  <main class="flex-1 flex flex-col justify-center px-8 md:px-12 py-16 max-w-6xl w-full mx-auto">
    <p class="font-mono text-orten-amber mb-16 text-sm tracking-widest">> /bin/run_events</p>
    
    <article class="group relative cursor-pointer block border-b border-white/10 pb-8 mb-8 hover:border-orten-amber transition-colors">
      <a href="#" class="absolute inset-0 z-10"></a>
      <div class="flex flex-col md:flex-row md:items-baseline gap-2 md:gap-16">
        <time class="font-mono text-xl text-white/40 w-32 shrink-0 group-hover:text-orten-amber transition-colors">15.05.26</time>
        <h2 class="text-5xl md:text-7xl font-serif text-white group-hover:translate-x-4 transition-transform duration-500 ease-out">Adam Rafferty</h2>
        <div class="hidden md:block ml-auto text-sm font-mono text-orten-amber opacity-0 group-hover:opacity-100 transition-opacity">
          [ TICKETS ]
        </div>
      </div>
    </article>

    <article class="group relative cursor-pointer block border-b border-white/10 pb-8 mb-8 hover:border-white transition-colors opacity-40 hover:opacity-100">
      <a href="#" class="absolute inset-0 z-10"></a>
      <div class="flex flex-col md:flex-row md:items-baseline gap-2 md:gap-16">
        <time class="font-mono text-xl text-white/40 w-32 shrink-0">12.09.26</time>
        <h2 class="text-4xl md:text-5xl font-serif text-white group-hover:translate-x-4 transition-transform duration-500 ease-out">Acoustic Blues Night</h2>
        <div class="hidden md:block ml-auto text-sm font-mono text-white/40 opacity-0 group-hover:opacity-100 transition-opacity">
          [ INFO ]
        </div>
      </div>
    </article>

  </main>

  <footer class="p-8 md:p-12 font-mono text-xs text-white/30 flex justify-between">
    <span>EST. 1993</span>
    <span>SPITTAL A. D. DRAU</span>
  </footer>

</body>
</html>
