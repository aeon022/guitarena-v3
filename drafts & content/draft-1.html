<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitarena - Hero Focus</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-orten-bg: #1a1715;
      --color-orten-card: #24201e;
      --color-orten-amber: #d9772b;
      --color-orten-text: #e6e0d8;
    }
    body {
      background-color: var(--color-orten-bg);
      color: var(--color-orten-text);
      /* Subtiler Noise für die analoge Keller-Textur */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-orten-amber selection:text-orten-bg">
  
  <header class="w-full p-6 md:p-12 flex justify-between items-center absolute z-20">
    <div class="text-2xl font-bold tracking-tighter">GUITARENA<span class="text-orten-amber">.</span></div>
    <nav class="flex gap-6 font-mono text-sm uppercase tracking-widest text-white/70">
      <a href="#" class="hover:text-orten-amber transition-colors">Programm</a>
      <a href="#" class="hover:text-white transition-colors">Archiv</a>
    </nav>
  </header>

  <section class="relative flex-1 flex flex-col justify-end p-6 md:p-16 overflow-hidden min-h-screen">
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1510915361894-db8b60106cb1?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-40 mix-blend-luminosity"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-orten-bg via-orten-bg/80 to-transparent"></div>

    <article class="relative z-10 max-w-4xl">
      <div class="inline-block border border-orten-amber text-orten-amber font-mono text-xs px-3 py-1 mb-6 uppercase tracking-widest">>> Nächstes Event</div>
      
      <h1 class="text-7xl md:text-9xl font-serif leading-[0.9] mb-4 text-white">Adam <br>Rafferty</h1>
      
      <div class="flex flex-col md:flex-row gap-4 md:gap-8 font-mono text-white/60 mb-10">
        <time datetime="2026-05-15T20:00" class="flex items-center gap-2">
          <svg class="w-5 h-5 text-orten-amber" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          15. Mai 2026, 20:00
        </time>
        <span class="flex items-center gap-2">
          <svg class="w-5 h-5 text-orten-amber" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Ortenburgerkeller, Schloss Porcia
        </span>
      </div>

      <a href="#" class="inline-block bg-orten-amber text-orten-bg px-8 py-4 font-bold tracking-wider hover:scale-105 transition-transform duration-300 ease-[cubic-bezier(0.34,1.56,0.64,1)]">
        TICKETS SICHERN
      </a>
    </article>
  </section>

</body>
</html>
